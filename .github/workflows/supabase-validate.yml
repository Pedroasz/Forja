name: Supabase validate

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/validate-supabase-migrations.mjs"
      - "scripts/test-consultation-authorization.mjs"
      - "scripts/test-consultation-lifecycle.mjs"
      - "scripts/test-consultation-measurements.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/supabase-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Show pinned CLI version
        run: pnpm run supabase:version
      - name: Validate migration filenames and ordering
        run: pnpm run supabase:validate:migrations
      - name: Require Docker
        run: docker info
      - name: Start local Supabase and apply migrations
        run: pnpm exec supabase start -x studio,imgproxy,functions,edge-runtime,analytics,vector
      - name: Inspect local migration history
        run: pnpm exec supabase migration list --local
      - name: Lint local database
        run: pnpm exec supabase db lint --local --fail-on error
      - name: Run local database advisors
        run: pnpm exec supabase db advisors --local --type all --fail-on error
      - name: Generate and validate local public database types
        id: database_types_match
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: senha-remota-falsa
        run: |
          set -euo pipefail
          generated_types="$RUNNER_TEMP/generated-database.types.ts"
          rm -f "$generated_types"
          env -u SUPABASE_ACCESS_TOKEN -u SUPABASE_DB_PASSWORD \
            pnpm exec supabase gen types --local --lang typescript --schema public \
            > "$generated_types"
          sed -i -e '$ { /^$/ d; }' "$generated_types"
          test -s "$generated_types"
          grep -Fq 'export type Database' "$generated_types"
          if grep -Eiq 'sb_secret_[A-Za-z0-9_-]+|sbp_[A-Za-z0-9_-]+|gh[pousr]_[A-Za-z0-9_]+|SUPABASE_(ACCESS_TOKEN|DB_PASSWORD)|postgres(ql)?://[^[:space:]]+:[^@[:space:]]+@|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' "$generated_types" supabase/database.types.ts; then
            echo "Secret scan failed for generated or committed database types."
            exit 1
          fi
          echo "safe_to_publish=true" >> "$GITHUB_OUTPUT"
          if ! cmp -s "$generated_types" supabase/database.types.ts; then
            echo "types_match=false" >> "$GITHUB_OUTPUT"
            echo "Committed database types do not match the local Supabase schema."
            diff -u \
              --label supabase/database.types.ts \
              --label generated-local-database.types.ts \
              supabase/database.types.ts "$generated_types" \
              | head -n 200 || true
            exit 1
          fi
          echo "types_match=true" >> "$GITHUB_OUTPUT"
      - name: Upload generated database types
        if: steps.database_types_match.outputs.safe_to_publish == 'true' && steps.database_types_match.outputs.types_match == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: v43a2d-generated-database-types
          path: ${{ runner.temp }}/generated-database.types.ts
          retention-days: 1
          if-no-files-found: error
      - name: Run V4.3A.2B authorization source contract
        id: consultation_authorization_source
        continue-on-error: true
        run: node scripts/test-consultation-authorization.mjs
      - name: Run V4.3A.2C lifecycle source contract
        id: consultation_lifecycle_source
        continue-on-error: true
        run: node scripts/test-consultation-lifecycle.mjs
      - name: Run V4.3A.2D measurement source contract
        id: consultation_measurements_source
        continue-on-error: true
        run: node scripts/test-consultation-measurements.mjs
      - name: Run focused V4.3A.2B authorization pgTAP
        id: consultation_authorization_pgtap
        continue-on-error: true
        run: pnpm exec supabase test db --local supabase/tests/v43a2_consultation_rls_test.sql
      - name: Run focused V4.3A.2C lifecycle pgTAP
        id: consultation_lifecycle_pgtap
        continue-on-error: true
        run: pnpm exec supabase test db --local supabase/tests/v43a2_consultation_lifecycle_test.sql
      - name: Run focused V4.3A.2D measurements pgTAP
        id: consultation_measurements_pgtap
        continue-on-error: true
        run: pnpm exec supabase test db --local supabase/tests/v43a2_consultation_measurements_test.sql
      - name: Run V4.3A.2C separate-session race matrix
        id: consultation_lifecycle_races
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          FORJA_A2C_DB_CONTAINER="$db_container" \
            node scripts/test-consultation-lifecycle.mjs --database-races
      - name: Run complete pgTAP suite
        id: complete_pgtap
        continue-on-error: true
        run: pnpm exec supabase test db
      - name: Enforce database test results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.database_types_match.outcome }}" = "success"
          test "${{ steps.consultation_authorization_source.outcome }}" = "success"
          test "${{ steps.consultation_lifecycle_source.outcome }}" = "success"
          test "${{ steps.consultation_measurements_source.outcome }}" = "success"
          test "${{ steps.consultation_authorization_pgtap.outcome }}" = "success"
          test "${{ steps.consultation_lifecycle_pgtap.outcome }}" = "success"
          test "${{ steps.consultation_measurements_pgtap.outcome }}" = "success"
          test "${{ steps.consultation_lifecycle_races.outcome }}" = "success"
          test "${{ steps.complete_pgtap.outcome }}" = "success"
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
